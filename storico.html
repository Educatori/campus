<style>

                    flex-wrap:wrap; background:var(--surface); padding:14px 18px;
                    border-radius:var(--radius-lg); border:1px solid var(--border); }
    .summary-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
                    gap:12px; margin-bottom:20px; }
    .summary-card { background:var(--surface); border:1px solid var(--border);
                    border-radius:var(--radius); padding:16px; text-align:center; }
    .summary-card .num { font-size:1.8rem; font-weight:700; font-family:var(--font-mono); }
    .summary-card .lbl { font-size:0.7rem; text-transform:uppercase; color:var(--text-2);
                         letter-spacing:0.05em; margin-top:4px; }
    .storico-table { width:100%; border-collapse:collapse; background:var(--surface);
                     border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-sm); }
    .storico-table th, .storico-table td { padding:10px 14px; text-align:left;
                     border-bottom:1px solid var(--border); font-size:0.85rem; }
    .storico-table th { background:var(--surface-2); font-weight:700; text-transform:uppercase;
                     font-size:0.7rem; letter-spacing:0.05em; color:var(--text-2); }
    .storico-table tr:last-child td { border-bottom:none; }
    .storico-table tr:hover td { background:var(--surface-2); }
    .badge-si { background:var(--absent-dim); color:var(--absent); padding:2px 8px;
                border-radius:6px; font-size:0.72rem; font-weight:700; }
    .badge-no { background:var(--ok-dim); color:var(--ok); padding:2px 8px;
                border-radius:6px; font-size:0.72rem; font-weight:700; }
    .badge-sw { background:var(--switched-dim); color:var(--switched); padding:2px 8px;
                border-radius:6px; font-size:0.72rem; font-weight:700; }
    #loading, #empty { text-align:center; padding:40px; color:var(--text-2); display:none; }
    #empty { color:var(--text-muted); font-style:italic; }
</style>

<div id="authLoading" style="...">
<div id="authLoading" style="
    position: fixed; inset: 0; z-index: 99998;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    font-family: var(--font-mono); font-size: 0.9rem; color: var(--text-2);
    text-align: center; padding: 20px;
">
    <!-- ← NUOVO: testo separato in uno span per poterlo aggiornare -->
    <span id="authLoadingText">⏳ Autenticazione (disponibile solo online)…</span>
</div>
<div class="container" style="display:none;">
    <header>
        <div class="header-brand">
            <h1><a href="campus_hub.html">Campus hub</a></h1>
            <div id="todayDate"><i>Storico giornaliero</i></div>
        </div>
        <div id="digitalClock">--:--:--</div>
        <div class="header-actions">
            <div id="connection-status" class="status-badge connected">🟢 Caricamento…</div>

    <div class="controls-bar">
        <span class="room-label">📅 DATA</span>
        <input type="date" id="dataSel"
               style="padding:9px 14px;border-radius:var(--radius);border:1px solid var(--border-2);
                      background:var(--bg-3);font-family:var(--font);font-size:0.85rem;">
        <button id="btnCarica" class="btn-toolbar" style="background:var(--accent);">🔍 Carica</button>
        <button id="btnOggi" class="btn-toolbar" style="background:var(--btn-t4);">↺ Oggi</button>

              color:var(--text-muted);margin-left:auto;"></span>

    <div id="lastUpdateInfo" style="font-size:0.75rem;color:var(--text-2);
     font-family:var(--font-mono);margin-bottom:10px;"></div>
<div id="summary" class="summary-grid" style="display:none;"></div>
    <div id="loading">⏳ Caricamento…</div>
    <div id="empty">Nessun dato per questa data.</div>
    <div id="tableWrap" style="display:none;"></div>
</div>

<div id="loginScreen">
    <div class="login-container">
       <h2>LOGIN</h2>
        <p>Inserisci le credenziali per continuare</p>
        <input type="email"    id="loginEmail"    placeholder="Email"    autocomplete="username">
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        <button id="loginBtn">ACCEDI</button>

    </div>
</div>

<!-- ============================================================
     ← NUOVO: Script classico (non-module) che parte PRIMA del
     module. Cattura l'offline, gestisce timeout, ascolta il
     ritorno online. Non dipende da Firebase.
     ============================================================ -->
<script>
(function () {
    'use strict';

    const loader     = document.getElementById('authLoading');
    const loaderText = document.getElementById('authLoadingText');
    if (!loader || !loaderText) return;

    // Flag settata dal module quando onAuthStateChanged scatta
    window._storicoAuthAvviato = false;

    function setLoaderMessage(msg) {
        loaderText.textContent = msg;
    }

    // 1) Check offline immediato (prima che il module provi a caricare Firebase)
    if (!navigator.onLine) {
        setLoaderMessage('📴 Offline — lo storico richiede connessione');
        console.log('[Storico] Offline all\'avvio: Firebase non verrà caricato');
    }

    // 2) Safety timeout: se dopo 10s l'auth non è partita, mostra errore
    //    (caso: captive portal, DNS bloccato, Firebase SDK non raggiungibile)

    setTimeout(function () {
        if (window._storicoAuthAvviato) return;
        if (!navigator.onLine) return;

        // ← NUOVO: distinguere file:// (modulo non caricato) da rete lenta
        if (location.protocol === 'file:') {
            setLoaderMessage('📁 Apri questa pagina via HTTP (non file://)');
        } else {
            setLoaderMessage('⚠️ Connessione assente o Firebase non raggiungibile');
        }
        console.warn('[Storico] Timeout: onAuthStateChanged non scattato');
    }, 10000);

    // 3) Se l'utente torna online, ricarica la pagina per riprovare
    window.addEventListener('online', function () {
        if (window._storicoAuthAvviato) return;
        setLoaderMessage('🌐 Connessione ripristinata — ricarico…');
        setTimeout(function () { location.reload(); }, 800);
    });

    // 4) Se va offline dopo essere stato online, avvisa (soft)
    window.addEventListener('offline', function () {
        if (window._storicoAuthAvviato) {
            // Auth già partita: mostra un avviso ma non bloccare
            console.warn('[Storico] Connessione persa durante la sessione');
        }
    });
})();
</script>

<script type="module">
import {
    auth, db, ref, get,
    signInWithEmailAndPassword, onAuthStateChanged
} from './js/firebase-campus_hub-config.js';

// ⚠️ SE IL PATH IN CONSOLE È DIVERSO, CAMBIA QUESTA RIGA:
const PATH_ROOT = 'convitto';

// Oggi in formato DD-MM-YYYY (quello usato da Firebase)
function oggiDmy() {
    const d = new Date();
    const g = String(d.getDate()).padStart(2, '0');
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const y = d.getFullYear();
    return `${g}-${m}-${y}`;
}

// Converte il valore di <input type="date"> (YYYY-MM-DD) in DD-MM-YYYY
function ymdToDmy(ymd) {
    if (!ymd) return '';
    const [y, m, d] = ymd.split('-');
    return `${d}-${m}-${y}`;
}

// Mostra un timestamp Unix (ms) in formato leggibile
function formattaTimestamp(ms) {
    if (!ms) return '—';
    return new Date(Number(ms)).toLocaleString('it-IT', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
    });
}

const $ = (id) => document.getElementById(id);
const loginScreen = $('loginScreen');
const container   = document.querySelector('.container');
const statusBadge = $('connection-status');
const dataSel     = $('dataSel');
const btnCarica   = $('btnCarica');
const btnOggi     = $('btnOggi');
const loading     = $('loading');
const empty       = $('empty');
const summary     = $('summary');
const tableWrap   = $('tableWrap');
const pathInfo    = $('pathInfo');

// Default: oggi
dataSel.value = new Date().toISOString().slice(0, 10);  // YYYY-MM-DD per l'input

// Clock
setInterval(() => {
    $('digitalClock').innerText = new Date().toLocaleTimeString('it-IT');
}, 1000);

// Login
$('loginBtn').onclick = async () => {
    const email = $('loginEmail').value.trim();
    const pwd   = $('loginPassword').value;
    $('loginError').textContent = '';

    // ← NUOVO: distinguere errore di rete da credenziali errate
    if (!navigator.onLine) {
        $('loginError').textContent = '📴 Sei offline — impossibile accedere';
        return;
    }

    try {
        await signInWithEmailAndPassword(auth, email, pwd);
    } catch (e) {
        const code = e?.code || '';
        if (code === 'auth/network-request-failed') {
            $('loginError').textContent = '📴 Errore di rete — controlla la connessione';
        } else {
            $('loginError').textContent = 'Credenziali errate';
        }
    }
};
$('loginPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('loginBtn').click();
});

// Auth
onAuthStateChanged(auth, (user) => {
    // ← NUOVO: segnala al safety timeout che l'auth è partita
    window._storicoAuthAvviato = true;

    const authLoading = document.getElementById('authLoading');
    if (authLoading) authLoading.style.display = 'none';

    if (!user) {
        loginScreen.style.display = 'flex';
        container.style.display = 'none';
        return;
    }
    loginScreen.style.display = 'none';
    container.style.display = 'block';
    statusBadge.textContent = '🟢 Firebase';
    carica();
});

// Carica
async function carica() {
    const dataInput = dataSel.value;          // "2026-10-01"
    if (!dataInput) return;
    empty.textContent = 'Nessun dato per questa data.';
    const dataPath = ymdToDmy(dataInput);     // "01-10-2026"

    loading.style.display = 'block';
    empty.style.display = 'none';
    summary.style.display = 'none';
    tableWrap.style.display = 'none';
    pathInfo.textContent = `${PATH_ROOT}/${dataPath}`;

    try {
        const snap = await get(ref(db, `${PATH_ROOT}/${dataPath}`));
        loading.style.display = 'none';

        if (!snap.exists()) {
            empty.style.display = 'block';
            return;
        }
        render(snap.val() || {});
    } catch (e) {
        loading.style.display = 'none';

        // ← NUOVO: distinguere errore di rete da errore applicativo
        const isNetworkError =
            !navigator.onLine ||
            (e?.code === 'auth/network-request-failed') ||
            /network|failed to fetch|offline/i.test(e?.message || '');

        if (isNetworkError) {
            empty.textContent = '📴 Connessione assente — impossibile caricare i dati. Riprova quando sei online.';
        } else {
            empty.textContent = '❌ Errore: ' + e.message;
        }
        empty.style.display = 'block';
    }
}

function render(dati) {
    // ── 1. Trova il nodo che contiene gli studenti ──
    const WRAPPER_CANDIDATI = ['dati', 'studenti', 'giornaliero', 'records', 'data'];

    let studentiNode = dati;
    let wrapperUsato = null;

    for (const key of WRAPPER_CANDIDATI) {
        if (dati[key] && typeof dati[key] === 'object' && !Array.isArray(dati[key])) {
            const sample = Object.values(dati[key])[0];
            if (sample && typeof sample === 'object') {
                studentiNode = dati[key];
                wrapperUsato = key;
                break;
            }
        }
    }

    // ── 2. Estrai lastUpdate ──
    const lastUpdate = dati.lastUpdate
        || (wrapperUsato && dati[wrapperUsato]?.lastUpdate)
        || null;

    // ── 3. Estrai entries degli studenti ──
    const entries = Object.entries(studentiNode)
        .filter(([k, v]) => {
            if (k === 'lastUpdate') return false;
            if (!v || typeof v !== 'object') return false;
            return 'esce' in v || 'entra' in v || 'assente' in v || 'dinnerno' in v;
        })
        .sort(([a], [b]) => a.localeCompare(b, 'it'));

    console.log(`📊 Storico: ${entries.length} studenti` +
                (wrapperUsato ? ` (wrapper: "${wrapperUsato}")` : ' (flat)'));

    // ── 4. Contatori ──
    let assenti = 0, nonCena = 0, sw = 0;
    entries.forEach(([, d]) => {
        if (d.assente) assenti++;
        if (d.dinnerno === '1' || d.dinnerno === 1) nonCena++;
        if (d.switch) sw++;
    });

    // ── 5. Info lastUpdate ──
    const infoEl = document.getElementById('lastUpdateInfo');
    if (infoEl) {
        infoEl.innerHTML = lastUpdate
            ? `🕐 Ultimo aggiornamento: <b>${formattaTimestamp(lastUpdate)}</b>`
            : '';
    }

    // ── 6. Card riepilogo ──
    summary.innerHTML = `
        <div class="summary-card"><div class="num" style="color:var(--accent)">${entries.length}</div><div class="lbl">Studenti</div></div>
        <div class="summary-card"><div class="num" style="color:var(--absent)">${assenti}</div><div class="lbl">Assenti</div></div>
        <div class="summary-card"><div class="num" style="color:var(--accent)">${nonCena}</div><div class="lbl">Non cena</div></div>
        <div class="summary-card"><div class="num" style="color:var(--switched)">${sw}</div><div class="lbl">Turno cambiato</div></div>
    `;
    summary.style.display = 'grid';

    // ── 7. Tabella ──
    const righe = entries.map(([cognome, d]) => {
        const ass = d.assente ? '<span class="badge-si">ASSENTE</span>' : '<span class="badge-no">presente</span>';
        const din = (d.dinnerno === '1' || d.dinnerno === 1) ? '<span class="badge-si">NON CENA</span>' : '<span class="badge-no">cena</span>';
        const s   = d.switch ? '<span class="badge-sw">SÌ</span>' : '—';
        return `<tr>
            <td><b>${cognome}</b></td>
            <td>${d.esce  || '—'}</td>
            <td>${d.entra || '—'}</td>
            <td>${ass}</td>
            <td>${din}</td>
            <td>${s}</td>
        </tr>`;
    }).join('');

    tableWrap.innerHTML = `
        <table class="storico-table">
            <thead><tr>
                <th>Cognome</th><th>Esce</th><th>Entra</th>
                <th>Stato</th><th>Cena</th><th>Switch</th>
            </tr></thead>
            <tbody>${righe}</tbody>
        </table>
    `;
    tableWrap.style.display = 'block';
}

btnCarica.onclick = carica;
btnOggi.onclick = () => {
    dataSel.value = new Date().toISOString().slice(0, 10); carica();
};
dataSel.addEventListener('change', carica);
</script>
