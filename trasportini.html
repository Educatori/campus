<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trasportini Furgone</title>

    <link rel="stylesheet" href="css/campus_hub.css">

    <style>
        #quadroSettimanale {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            animation: fadeIn 0.3s ease;
        }
        @media (max-width: 900px) {
            #quadroSettimanale { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            #quadroSettimanale { grid-template-columns: 1fr; }
        }

        .day-card { align-self: start; }

        .day-card.student-row::before { display: none; }

        .day-header {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 14px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--surface-3);
        }
        .time-slot {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 12px;
            margin-bottom: 10px;
        }
        .time-slot:last-child { margin-bottom: 0; }

        .time-slot.special-slot {
            border-left: 4px solid var(--lab);
            background: var(--lab-dim);
        }
        .time-slot.simula-no-slot {
            border-left: 4px solid var(--absent);
            background: var(--absent-dim);
        }
        .time-slot.simula-si-slot {
            border-left: 4px solid var(--ok);
            background: var(--ok-dim);
        }
        .time-slot.evento-speciale-slot {
            border-left: 4px solid var(--switched);
            background: var(--switched-dim);
        }
        .evento-speciale-slot .slot-title { color: var(--switched); }

        .slot-title {
            font-size: 0.78rem;
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--accent);
            margin-bottom: 4px;
            display: block;
        }

        .special-slot .slot-title { color: var(--lab); }
        .simula-no-slot .slot-title { color: var(--absent); }
        .simula-si-slot .slot-title { color: var(--ok); }

        .slot-data-list {
            margin: 0;
            padding-left: 16px;
            font-size: 0.82rem;
            color: var(--text-2);
        }
        .slot-data-list li { margin-bottom: 2px; }

        /* Evidenzia la classe aggiunta nella corsa di rientro */
        .classe-aggiunta {
            font-weight: 700;
            color: var(--lab); /* stesso colore di ORARI_SPECIALI */
        }

        /* Badge Bus (arancione) e Furgone (rosa/grigio) */
        .bus-label,
        .furgone-label {
            display: inline-block;
            padding: 1px 6px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.72rem;
            line-height: 1.4;
            vertical-align: middle;
            letter-spacing: 0.02em;
            margin-right: 2px;
        }
        .bus-label {
            color: #cb6b34;
            background: #ffdba8;
        }
        .furgone-label {
            color: #e14392;
            background: #d7d7d7;
        }

        .info-speciali {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent-2);
            border-radius: var(--radius-lg);
            margin-bottom: var(--gap-block);
            padding: 10px 16px;
            font-size: 0.8rem;
            color: var(--text-2);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }
        .info-speciali .info-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; }
        .info-speciali .info-text { line-height: 1.5; }
        .info-speciali .info-text strong { color: var(--text); }

        /* Badge modalità simulazione */
        .sim-badge {
            display: none;
            background: var(--switched-dim);
            border: 1px solid var(--switched);
            color: var(--switched);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: var(--gap-block);
            text-align: center;
            font-family: var(--font-mono);
            letter-spacing: 0.03em;
        }
        .sim-badge.visible { display: block; }

        /* Toolbar simulazione data */
        .sim-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: var(--radius-lg);
            padding: 10px 16px;
            margin-bottom: var(--gap-block);
            box-shadow: var(--shadow-sm);
        }
        .sim-toolbar-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .sim-toolbar input[type="date"] {
            background: var(--bg-3);
            border: 1px solid var(--border-2);
            border-radius: var(--radius);
            color: var(--text);
            padding: 8px 12px;
            font-family: var(--font);
            font-size: 0.82rem;
            outline: none;
            transition: border-color var(--t), box-shadow var(--t);
        }
        .sim-toolbar input[type="date"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }
        .sim-btn {
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-family: var(--font);
            font-weight: 700;
            font-size: 0.78rem;
            padding: 8px 16px;
            letter-spacing: 0.03em;
            transition: all var(--t);
            color: white;
        }
        .sim-btn-primary {
            background: var(--accent);
            box-shadow: 0 2px 8px var(--accent-dim);
        }
        .sim-btn-primary:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }
        .sim-btn-secondary {
            background: var(--btn-t4);
            box-shadow: 0 2px 8px rgba(71,85,105,0.25);
        }
        .sim-btn-secondary:hover {
            filter: brightness(1.05);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        /* Override header per trasportini.html */
        header {
            background: var(--accent-dim);
            border-color: var(--border);
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1><a href="index.html">Piano Trasporti Settimanali</a></h1>
                <div id="todayDate">-- -- ----</div>
            </div>
            <div style="text-align: right;">
                <div id="digitalClock">--:--:--</div>
            </div>
        </header>

        <!-- Badge modalità simulazione -->
        <div id="simBadge" class="sim-badge"></div>

        <div class="note-toolbar-container">
            <div class="note-content">
                <span class="note-icon">📌</span>
                <textarea id="dailyNotes" placeholder="Note offline..." class="note-input" rows="2"></textarea>
                <button class="clear-note-btn" onclick="cancellaNote()" title="Svuota note">✕</button>
            </div>
        </div>

        <!-- Selettore data simulazione -->
        <div class="sim-toolbar">
            <span class="sim-toolbar-label">📅 Simula data</span>
            <input type="date" id="simDateInput">
            <button class="sim-btn sim-btn-primary" onclick="applicaSimulazione()">Simula</button>
            <button class="sim-btn sim-btn-secondary" onclick="resetSimulazione()">↺ Oggi</button>
        </div>

        <div class="info-speciali">
            <span class="info-icon">ℹ️</span>
            <div class="info-text">
                <strong>Trasporti speciali 2A / 2B:</strong> le caselle <strong>CHIMICA</strong> sono visibili solo nella settimana in cui si svolgono gli eventi.<br>
                <strong>Simulimpresa NO:</strong> casella nascosta dal <strong>1 ottobre al 5 dicembre 2026</strong>.<br>
            </div>
        </div>

        <div id="quadroSettimanale"></div>
    </div>

    <script>
        // --- SIMULAZIONE DATA ---
        let DATA_SIMULATA = null;

        function getDataSimulataDaURL() {
            const params = new URLSearchParams(window.location.search);
            const s = params.get('simula');
            if (!s) return null;
            const parts = s.split('-').map(Number);
            if (parts.length !== 3 || parts.some(isNaN)) return null;
            return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        function getOggi() {
            return DATA_SIMULATA ? new Date(DATA_SIMULATA) : new Date();
        }

        function formatDataPerInput(d) {
            const yyyy = d.getFullYear();
            const mm   = String(d.getMonth() + 1).padStart(2, '0');
            const dd   = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function applicaSimulazione() {
            const input = document.getElementById('simDateInput');
            if (!input || !input.value) {
                alert('Seleziona una data da simulare.');
                return;
            }
            const [y, m, d] = input.value.split('-').map(Number);
            DATA_SIMULATA = new Date(y, m - 1, d);

            aggiornaSimBadge();
            aggiornaDataHeader();
            renderTabella();
        }

        function resetSimulazione() {
            DATA_SIMULATA = null;

            const input = document.getElementById('simDateInput');
            if (input) input.value = '';

            aggiornaSimBadge();
            aggiornaDataHeader();
            renderTabella();
        }

        function aggiornaSimBadge() {
            const badge = document.getElementById('simBadge');
            if (!badge) return;
            if (DATA_SIMULATA) {
                badge.textContent = '🧪 MODALITÀ SIMULAZIONE — data virtuale: ' +
                    DATA_SIMULATA.toLocaleDateString('it-IT', {
                        day: 'numeric', month: 'long', year: 'numeric'
                    });
                badge.classList.add('visible');
            } else {
                badge.textContent = '';
                badge.classList.remove('visible');
            }
        }

        function aggiornaDataHeader() {
            const dateEl = document.getElementById('todayDate');
            if (!dateEl) return;
            const d = getOggi();
            dateEl.innerText = d.toLocaleDateString('it-IT', {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
            });
        }

        // --- CONFIGURAZIONE DEI DATI ---
        const programmaDati = {
            "lunedì": {
                "14:30": ["3A 🚕🚕 da Gare x8"],
                "15:50": ["5A, 5B 🚕🚕 da Gare x23"],
                "16:40": ["🚌 1A, 1B, 3B, 4A, 4B + StV 🅿️"]
            },
            "martedì": {
                "14:30": ["3B 🚕🚕 da Gare x9"],
                "14:10 simulimpresa NO": ["4B 🚕🚕 da Gare x6"],
                "15:50": ["🚌 3A"],
                "16:40": ["🚌 1A, 1B, 5A, 5B", " poi 4A 🚕🚕 da Gare x5"],
                "17:00 simulimpresa SI": ["4B 🚕🚕 da StV x6"],
                "18:00": ["StV 🅿️"]
            },
            "mercoledì": {
                "14:10 simulimpresa NO": ["4A 🚕🚕 da Gare x5"],
                "16:40": ["🚌 3B", " poi 1A, 4B 🚕🚕 da Gare x11"],
                "17:00 simulimpresa SI": ["4A 🚕🚕 da StV x5"],
                "17:30": ["🚌 1B, 3A, 5A, 5B + StV 🅿️"]
            },
            "giovedì": {
                "14:10": ["5A 🚕🚕 da Gare x13"],
                "15:10": ["4C 🚕🚕 da Gare x9"],
                "16:10": ["1B 🚕🚕 da Gare x9"],
                "16:40": ["🚌 1A, 3A, 3B, 4A, 4B + StV 🅿️"]
            }
        };

        const ordineOrari = [
            "14:00", "14:10", "14:10 simulimpresa NO", "14:30", "14:50 CHIMICA", "14:50",
            "15:10", "15:50", "16:10", "16:40",
            "17:00", "17:00 simulimpresa SI", "17:30", "18:00"
        ];

        const ORARI_SPECIALI = ["14:50 CHIMICA"];

        // --- PERIODI SIMULIMPRESA ---
        // Ogni periodo indica quale casella deve essere NASCOSTA.
        const PERIODI_SIMULIMPRESA = [
            {
                inizio: new Date(2026, 9, 1),   // 1 ottobre 2026
                fine:   new Date(2026, 11, 5),  // 5 dicembre 2026
                target: '14:10 simulimpresa NO'
            },
            {
                inizio: new Date(2026, 11, 6),  // 6 dicembre 2026
                fine:   new Date(2027, 0, 10),  // 10 gennaio 2027
                target: '17:00 simulimpresa SI'
            }
        ];

        function getTargetNascosto(data = getOggi()) {
            const d = new Date(data.getFullYear(), data.getMonth(), data.getDate());
            for (const periodo of PERIODI_SIMULIMPRESA) {
                if (d >= periodo.inizio && d <= periodo.fine) {
                    return periodo.target;
                }
            }
            return null;
        }

        // --- EVENTI SPECIALI ---
        // classe: classe che effettua il trasporto speciale delle 14:50
        // rientro: dove aggiungere la classe nella corsa di ritorno
        //   orario = slot da modificare
        //   indice = posizione nella lista dello slot
        const eventiSpeciali = [
            // --- 2A (mercoledì) ---
            {
                data: new Date(2026, 9, 21), giorno: "mercoledì", orario: "14:50 CHIMICA",
                descrizione: "2A 🚕🚕 a StV x19",
                classe: "2A",
                rientro: { orario: "16:40", indice: 0 }
            },
            {
                data: new Date(2026, 10, 4), giorno: "mercoledì", orario: "14:50 CHIMICA",
                descrizione: "2A 🚕🚕 a StV x19",
                classe: "2A",
                rientro: { orario: "16:40", indice: 0 }
            },
            {
                data: new Date(2026, 11, 16), giorno: "mercoledì", orario: "14:50 CHIMICA",
                descrizione: "2A 🚕🚕 a StV x19",
                classe: "2A",
                rientro: { orario: "16:40", indice: 0 }
            },

            // --- 2B (martedì) ---
            {
                data: new Date(2026, 9, 20), giorno: "martedì", orario: "14:50 CHIMICA",
                descrizione: "2B 🚕🚕 a StV x21",
                classe: "2B",
                rientro: { orario: "16:40", indice: 0 }
            },
            {
                data: new Date(2026, 10, 3), giorno: "martedì", orario: "14:50 CHIMICA",
                descrizione: "2B 🚕🚕 a StV x21",
                classe: "2B",
                rientro: { orario: "16:40", indice: 0 }
            },
            {
                data: new Date(2026, 11, 15), giorno: "martedì", orario: "14:50 CHIMICA",
                descrizione: "2B 🚕🚕 a StV x21",
                classe: "2B",
                rientro: { orario: "16:40", indice: 0 }
            }
        ];

        function getMonday(date) {
            const d = new Date(date);
            d.setHours(0,0,0,0);
            const day = d.getDay();
            const diff = (day === 0 ? -6 : 1 - day);
            const monday = new Date(d);
            monday.setDate(d.getDate() + diff);
            return monday;
        }

        function getProgrammaCorrente() {
            const programma = JSON.parse(JSON.stringify(programmaDati));
            const oggi = getOggi();
            const mondayOggi = getMonday(oggi);

            eventiSpeciali.forEach(evento => {
                const mondayEvento = getMonday(evento.data);
                if (mondayOggi.getTime() !== mondayEvento.getTime()) return;

                const giorno = evento.giorno;
                const orario = evento.orario;

                // 1) Inserisce lo slot speciale 14:50 CHIMICA
                if (!programma[giorno]) programma[giorno] = {};
                if (!programma[giorno][orario]) programma[giorno][orario] = [];
                programma[giorno][orario].push(evento.descrizione);

                // 2) Aggiunge la classe nella corsa di rientro indicata
                if (evento.classe && evento.rientro) {
                    const { orario: orarioRientro, indice } = evento.rientro;
                    const lista = programma[giorno] && programma[giorno][orarioRientro];
                    if (lista && lista[indice] !== undefined && !lista[indice].includes('+' + evento.classe)) {
                        lista[indice] = lista[indice] + ' <span class="classe-aggiunta">+' + evento.classe + '</span>';
                    }
                }
            });

            return programma;
        }

        // Sostituisce le emoji con badge colorati
        function formatTrasporto(testo) {
            return testo
                .replace(/🚌/g, '<span class="bus-label">Bus</span>')
                .replace(/🚕🚕/g, '<span class="furgone-label">Furgone</span>');
        }

        function init() {
            // Legge ?simula=AAAA-MM-GG dall'URL se presente
            const urlData = getDataSimulataDaURL();
            if (urlData) {
                DATA_SIMULATA = urlData;
                const input = document.getElementById('simDateInput');
                if (input) input.value = formatDataPerInput(urlData);
            }

            aggiornaDataHeader();
            aggiornaSimBadge();

            setInterval(() => {
                const clockEl = document.getElementById('digitalClock');
                if (clockEl) clockEl.innerText = new Date().toLocaleTimeString('it-IT');
            }, 1000);

            const noteInput = document.getElementById('dailyNotes');
            if (noteInput) {
                const noteSalvate = localStorage.getItem('note_trasportini');
                if (noteSalvate) {
                    noteInput.value = noteSalvate;
                }

                noteInput.addEventListener('input', () => {
                    localStorage.setItem('note_trasportini', noteInput.value);
                });
            }

            renderTabella();
        }

        function cancellaNote() {
            if (confirm("⚠️ Cancellare definitivamente le note?")) {
                const noteInput = document.getElementById('dailyNotes');
                if (noteInput) {
                    noteInput.value = '';
                    localStorage.removeItem('note_trasportini');
                }
            }
        }

        function renderTabella() {
            const container = document.getElementById('quadroSettimanale');
            if (!container) return;
            container.innerHTML = "";

            const targetNascosto = getTargetNascosto();
            const programmaCorrente = getProgrammaCorrente();

            Object.keys(programmaCorrente).forEach(giorno => {
                const card = document.createElement('div');
                card.className = 'day-card student-row';

                const header = document.createElement('div');
                header.className = 'day-header';
                header.innerText = giorno;
                card.appendChild(header);

                const orariDelGiorno = programmaCorrente[giorno];

                ordineOrari.forEach(ora => {
                    if (orariDelGiorno[ora] && orariDelGiorno[ora].length > 0) {

                        // Se questa slot è il target del periodo attivo, la salto
                        if (targetNascosto && ora === targetNascosto) {
                            return;
                        }

                        const slot = document.createElement('div');

                        let varianteClasse = '';
                        if (ora === '14:10 simulimpresa NO') {
                            varianteClasse = 'simula-no-slot';
                        } else if (ora === '17:00 simulimpresa SI') {
                            varianteClasse = 'simula-si-slot';
                        } else if (ORARI_SPECIALI.includes(ora)) {
                            varianteClasse = 'special-slot';
                        } else if (ora === '00:00') {
                            varianteClasse = 'evento-speciale-slot';
                        }

                        slot.className = `time-slot ${varianteClasse}`.trim();

                        const elementiLista = orariDelGiorno[ora]
                            .map(info => `<li>${formatTrasporto(info)}</li>`)
                            .join('');

                        slot.innerHTML = `
                            <span class="slot-title">${ora}</span>
                            <ul class="slot-data-list">
                                ${elementiLista}
                            </ul>
                        `;
                        card.appendChild(slot);
                    }
                });

                if (card.children.length > 1) {
                    container.appendChild(card);
                }
            });
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
